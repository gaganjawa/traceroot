[project]
name = "traceroot"
version = "0.1.0"
description = "Evidence-grounded AI system for production incident investigation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.17.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval>=4.2.6",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
